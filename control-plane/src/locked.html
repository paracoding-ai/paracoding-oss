<!--
  [SEC-GATE-STAGES-V1]  THE LOCKED STAGE.

  What this is: the ONLY document ANY console URL serves to a caller with no valid
  session. It carries the four flows that must work before a session can exist, and
  nothing else. No pending jobs. No commands. No strain pastes. No mint. No approve
  buttons. No QR generator.

  Why it exists: GET /gate returned 111,618 bytes to anyone who asked. It could not
  populate -- every data API checks the session and 401s -- but it handed a stranger
  the full route map, the enrollment design and the approval flow for free. The
  operator's instruction was exact: hand out the bare minimum HTML for each stage.

  [SEC-NOGATE-V1] 2026-08-14: /gate and the 142KB document behind it are DELETED. This
  page did not move with them -- it is now served IN PLACE, under a 401, at whichever
  console URL the caller asked for (/harness, /wiki, /flow, /chat, /lakeview,
  /flowhood). That is why landed() below reloads instead of navigating: there is no
  destination to carry and no ?next= to get wrong.

  THE FOUR FLOWS, and every one of them is load-bearing. Removing any of them locks
  the operator out of his own gate with no way back except a manual Cloud Shell
  bootstrap, so do not "simplify" this file without testing all four:

    1. UNLOCK      POST /api/webauthn/unlock/options  {}
                   POST /api/webauthn/unlock/verify   {response}
       The normal path. A registered passkey, an assertion, a session cookie.

    2. FIRST SETUP POST /api/webauthn/register/options {bootstrapSecret}
                   POST /api/webauthn/register/verify  {bootstrapSecret,response}
       install.sh sends a brand-new operator to  /harness?setup=<secret> .
       If this is missing, every fresh install is bricked at step 8 of 9.

    3. ADD A DEVICE POST /api/webauthn/enroll/options {enrollToken}
                    POST /api/webauthn/enroll/verify  {enrollToken,response}
       Consumed from  /harness?enroll=<token> . This page CONSUMES an enroll
       token; it never MINTS one. Minting (/api/webauthn/enroll/link) stays behind a
       session check, because handing out an enrolment link is a privileged act and
       must not be reachable from the locked stage.

    4. STATUS      GET /api/webauthn/status
       Chooses which of the three to show.

  WHAT /api/webauthn/status DISCLOSES, stated accurately -- the note here used to say
  "anonymous" and that was wrong in the direction that alarms a reader. The route is
  mapped 'console', and the console service runs with IAP ON, so every caller has
  already been admitted by Google IAP against an in-domain account; it answers
  without a PASSKEY SESSION, which is necessarily true because this page must choose
  a flow before a session can exist. It reports {registered, setupEnabled, sessionMin,
  iap}. Acting on setupEnabled is not possible without the bootstrap secret: both
  setup endpoints refuse unless a constant-time waEq() matches WA_BOOTSTRAP_SECRET.
  [SEC-STATUS-SETUPFLAG-V83] narrows it anyway, because narrowing costs nothing --
  setupEnabled is now reported ONLY while no credential is registered, which is the
  only state in which this page reads it (the branch below sits after
  `else if (st.registered)`). Once a passkey exists the field is constant false.

  Google is NOT part of this page. Unlocking is passkey-only; the Google token is
  for executing approved work and is obtained inside the authenticated document.
  That is why no third-party script tag appears below.

  The simplewebauthn browser bundle is vendored inline below, pinned by tarball
  sha512 and file sha384. It used to be described as a byte-identical copy of the
  one in gate.html; that file is gone, so this is now the only copy in the tree.
-->

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="referrer" content="no-referrer">
  <title>The Autoclave</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
           background:#0a0a0f; color:#e8e8ea;
           font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
    .card { width:min(92vw,420px); padding:32px 28px; border:1px solid #1e2430; border-radius:14px;
            background:#0e1116; text-align:center; }
    .brand { letter-spacing:.28em; font-size:11px; color:#8a8f98; text-transform:uppercase; }
    h1 { margin:6px 0 22px; font-size:22px; font-weight:600; color:#d8b45a; }
    button { width:100%; padding:13px 18px; font-size:15px; font-weight:600; cursor:pointer;
             border:0; border-radius:9px; background:#d8b45a; color:#14100a; }
    button:disabled { opacity:.5; cursor:default; }
    input { width:100%; padding:12px; margin-bottom:12px; border-radius:9px;
            border:1px solid #2a3140; background:#0a0d12; color:#e8e8ea; font-size:15px; }
    .msg { margin-top:16px; font-size:14px; min-height:20px; }
    .err { color:#ef6b6b; }
    .ok  { color:#5fd08a; }
    .hint { margin-top:18px; font-size:12px; color:#6f757e; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">Paracoding.AI</div>
    <h1>The Autoclave</h1>
    <div id="pane"><button id="go" disabled>Checking…</button></div>
    <div class="msg" id="msg"></div>
    <div class="hint" id="hint"></div>
  </div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var msg = $('msg'), hint = $('hint'), go = $('go');

  function say(t, cls) { msg.textContent = t || ''; msg.className = 'msg' + (cls ? ' ' + cls : ''); }

  // Same shape as the authenticated document's jp(): POST, JSON, cookies included.
  async function jp(u, b) {
    var r = await fetch(u, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      credentials: 'include',
      body: JSON.stringify(b || {})
    });
    var d = {};
    try { d = await r.json(); } catch (e) {}
    return { ok: r.ok, status: r.status, data: d };
  }

  var q = new URLSearchParams(location.search);
  var setupSecret = q.get('setup') || '';
  var enrollToken = q.get('enrollToken') || q.get('enroll') || '';

  // One place decides what happens on success, so no flow can forget to land.
  function landed() {
    say('Unlocked. Loading…', 'ok');
    // Re-request THIS url. With a session cookie the server now returns the real page
    // instead of this one, so a reload is the whole handoff and the caller lands back
    // where they were. The query string is dropped on purpose: it can carry a one-time
    // ?setup= secret or an ?enroll= token, and neither should survive into history.
    location.replace(location.pathname);
  }

  function fail(e, what) {
    var t = (e && (e.message || e.name)) || String(e || 'failed');
    if (/NotAllowed|AbortError/i.test(t)) t = 'Cancelled, or the authenticator timed out.';
    say(what + ': ' + t, 'err');
    go.disabled = false;
  }

  async function runUnlock() {
    go.disabled = true; say('Waiting for your passkey…');
    try {
      var o = await jp('/api/webauthn/unlock/options', {});
      if (!o.ok) throw new Error('server refused (' + o.status + ')');
      var asr = await SimpleWebAuthnBrowser.startAuthentication(o.data);
      var v = await jp('/api/webauthn/unlock/verify', { response: asr });
      if (!v.ok) throw new Error('verification refused (' + v.status + ')');
      landed();
    } catch (e) { fail(e, 'Unlock'); }
  }

  async function runSetup() {
    go.disabled = true; say('Registering this device…');
    try {
      var o = await jp('/api/webauthn/register/options', { bootstrapSecret: setupSecret });
      if (!o.ok) throw new Error('server refused (' + o.status + ')');
      var att = await SimpleWebAuthnBrowser.startRegistration(o.data);
      var v = await jp('/api/webauthn/register/verify', { bootstrapSecret: setupSecret, response: att });
      if (!v.ok) throw new Error('verification refused (' + v.status + ')');
      landed();
    } catch (e) { fail(e, 'Registration'); }
  }

  async function runEnroll() {
    go.disabled = true; say('Adding this device…');
    try {
      var o = await jp('/api/webauthn/enroll/options', { enrollToken: enrollToken });
      if (!o.ok) throw new Error('server refused (' + o.status + ')');
      var att = await SimpleWebAuthnBrowser.startRegistration(o.data);
      var v = await jp('/api/webauthn/enroll/verify', { enrollToken: enrollToken, response: att });
      if (!v.ok) throw new Error('verification refused (' + v.status + ')');
      landed();
    } catch (e) { fail(e, 'Enrolment'); }
  }

  async function boot() {
    if (typeof SimpleWebAuthnBrowser === 'undefined') {
      say('The passkey library did not load. This page is unusable; do not retry blindly.', 'err');
      return;
    }
    var st = { registered: false, setupEnabled: false };
    try {
      var r = await fetch('/api/webauthn/status', { credentials: 'include' });
      st = await r.json();
    } catch (e) {
      say('Cannot reach the server.', 'err');
      return;
    }

    if (enrollToken) {
      go.textContent = 'Add this device';
      go.onclick = runEnroll;
      hint.textContent = 'Using a one-time enrolment link.';
    } else if (setupSecret) {
      go.textContent = 'Register your passkey';
      go.onclick = runSetup;
      hint.textContent = 'First-time setup. This link works once.';
    } else if (st.registered) {
      go.textContent = 'Unlock with passkey';
      go.onclick = runUnlock;
      hint.textContent = st.sessionMin ? ('A session lasts ' + st.sessionMin + ' minutes.') : '';
    } else if (st.setupEnabled) {
      go.textContent = 'Register your passkey';
      go.onclick = function () { say('Open the setup link from install.sh — it carries the one-time secret.', 'err'); };
      hint.textContent = 'No passkey is registered yet.';
    } else {
      go.textContent = 'No way in from here';
      hint.textContent = 'No passkey is registered and the setup window is closed. Recovery is a manual re-run of the installer bootstrap step from your own shell.';
      return;
    }
    go.disabled = false;
    // A passkey prompt must be user-initiated, so nothing auto-runs here.
  }

  boot();
})();
</script>
