[Service]
# The executor runs jobs with PATH narrowed to symlinks of allowlisted binaries, resolved from
# THIS PATH. The snap gcloud cannot start under NoNewPrivileges=true (snap-confine needs its
# file capabilities: "cap_dac_override not found"), so the tarball Cloud SDK that the control
# plane installs at /srv/fleet/google-cloud-sdk goes first; /snap/bin stays as the fallback.
Environment=PATH=/srv/fleet/google-cloud-sdk/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/snap/bin
Environment=HOME=/srv/fleet
